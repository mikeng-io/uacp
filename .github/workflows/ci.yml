name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel stale in-progress runs on PRs only. Main runs are not cancelled so
# rapid back-to-back merges don't silently drop the post-merge test-compat signal.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality (ruff + pyright)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the package so pyright resolves real dependency types (e.g.
          # pydantic's UacpConfig from config.py). ruff and pyright are pinned in
          # [project.optional-dependencies].dev — both are version-sensitive and
          # can redden unrelated PRs if unpinned. Bump deliberately.
          pip install -e '.[dev]'

      # Paths and pyright scope are owned by the Makefile — CI just calls targets
      # so there is one source of truth for both local dev and CI.
      - name: Ruff lint
        run: make lint

      - name: Ruff format check
        run: make format

      - name: Pyright (strict-scoped engines)
        run: make types

  test:
    name: pytest (3.13)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      # uv is needed so the plugin MCP boot test (TestMcpServerBoots) actually
      # runs instead of skipping — it provisions the server via `uv run --with …`,
      # exactly as the Claude Code plugin manifest does.
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # [mcp] pulls the mcp client SDK so the boot test can speak MCP to the
          # server; without it that high-value runtime check skips silently.
          pip install -e '.[dev,mcp]'

      - name: Run tests
        run: make test

  # Forward-compatibility check — runs only after merge to main, not on PRs.
  # A 3.14 breakage is a follow-up ticket, not a merge blocker.
  test-compat:
    name: pytest (3.14 compat)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,mcp]'

      - name: Run tests
        run: make test

  # Backward-compatibility check at the DECLARED floor (`requires-python` in
  # pyproject.toml). The 3.13/3.14 jobs above only ever prove the code runs on a
  # modern interpreter — they cannot see a 3.12-only construct that makes the
  # package fail to import for a user, or for a host runtime (Hermes' venv is
  # 3.11), that is inside the range we advertise. Because plugin loaders catch
  # per-plugin exceptions, such a break shows up as "plugin disabled", not a
  # crash, so it must be caught here. This job is a MERGE BLOCKER: unlike the
  # 3.14 forward-compat job, it guards a contract we already publish.
  #
  # `tests/unit/test_python_version_floor.py` covers the grammar half on every
  # interpreter; this job adds the half that needs a real floor interpreter —
  # actually importing the shipped modules.
  test-floor:
    name: import check (declared floor)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read requires-python floor from pyproject.toml
        id: floor
        run: |
          floor=$(python3 -c "import re,pathlib; \
            print(re.search(r'^requires-python\s*=\s*\"[><=~^]*\s*(\d+\.\d+)', \
            pathlib.Path('pyproject.toml').read_text(), re.M).group(1))")
          echo "Declared floor: $floor"
          echo "version=$floor" >> "$GITHUB_OUTPUT"

      - name: Set up Python at the declared floor
        uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.floor.outputs.version }}

      - name: Install the package as a user would
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # Import every shipped module on the floor interpreter. A SyntaxError or a
      # too-new stdlib call surfaces here as a hard failure instead of a silently
      # disabled plugin on a user's machine.
      - name: Import shipped modules on the floor interpreter
        run: python scripts/check_python_floor.py
